
<app-sidebar-gerente></app-sidebar-gerente>
<div class="container">
  <app-header></app-header>
  <div class="tabela-usuario">
    <h1>Gerenciar Usuários</h1>
    <div class="list-usuario">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Email</th>
            <th>Perfil</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of usuarios">
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.role }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

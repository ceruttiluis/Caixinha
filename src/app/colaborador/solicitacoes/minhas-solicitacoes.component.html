<app-header></app-header>

<div class="solicitacoes-container">
  <h2>Minhas Solicitações</h2>

  <div *ngIf="loading">Carregando...</div>

  <table *ngIf="!loading && cupons.length > 0">
    <thead>
      <tr>
        <th>Data</th>
        <th>Tipo</th>
        <th>Valor</th>
        <th>Excedente</th>
        <th>Status</th>
        <th>Comprovante</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let cupom of cupons">
        <td>{{ cupom.data_nota | date: 'shortDate' }}</td>
        <td>{{ cupom.tipo_gasto }}</td>
        <td>R$ {{ cupom.valor.toFixed(2) }}</td>
        <td [ngClass]="{
          'positivo': cupom.excedente === 0,
          'negativo': cupom.excedente > 0
        }">
          R$ {{ cupom.excedente?.toFixed(2) || '0.00' }}
        </td>
        <td>{{ cupom.status }}</td>
        <td>
          <a [href]="cupom.url_imagem" target="_blank">Ver</a>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!loading && cupons.length === 0">Nenhuma solicitação encontrada.</p>
</div>

<app-header></app-header>
<main class="dashboard">
  <app-sidebar-colaborador></app-sidebar-colaborador>
  <section class="content animate-fade-in">
    <div class="Description">
      <h2>Periodo</h2>
    </div>
    <div class="filters">
       <label>
        <select [(ngModel)]="periodoSelecionado" (ngModelChange)="aplicarFiltros()">
          <option value="" disabled selected>Selecione o Periodo</option>
          <option value="todos">Todos</option>
          <option value="mensal">Mensal</option>
          <option value="trimestral">Trimestral</option>
          <option value="semestral">Semestral</option>
          <option value="anual">Anual</option>
          <option value="personalizado">Personalizado</option>
        </select>
        <div class="periodo" *ngIf="periodoSelecionado === 'personalizado'">
          <input type="date" [(ngModel)]="dataInicio" (change)="aplicarFiltros()">
          <input type="date" [(ngModel)]="dataFim" (change)="aplicarFiltros()">
        </div>
        <div class="periodo" *ngIf="periodoSelecionado === 'mensal'">
          <select [(ngModel)]="mesSelecionado" (change)="aplicarFiltros()">
            <option [ngValue]="undefined" disabled>Selecione o Mes</option>
            <option value="1">Janeiro</option>
            <option value="2">Fevereiro</option>
            <option value="3">Março</option>
            <option value="4">Abril</option>
            <option value="5">Maio</option>
            <option value="6">Junho</option>
            <option value="7">Julho</option>
            <option value="8">Agosto</option>
            <option value="9">Setembro</option>
            <option value="10">Outubro</option>
            <option value="11">Novembro</option>
            <option value="12">Dezembro</option>
          </select>
        </div>
        <div class="periodo" *ngIf="periodoSelecionado === 'trimestral'">
          <select [(ngModel)]="trimestreSelecionado" (change)="aplicarFiltros()">
            <option [ngValue]="undefined" disabled>Selecione o Trimestre</option>
            <option value="1">1º Trimestre (Jan-Mar)</option>
            <option value="2">2º Trimestre (Abr-Jun)</option>
            <option value="3">3º Trimestre (Jul-Set)</option>
            <option value="4">4º Trimestre (Out-Dez)</option>
          </select>
        </div>
        <div class="periodo" for *ngIf="periodoSelecionado === 'semestral'">
          <select [(ngModel)]="semestreSelecionado" (change)="aplicarFiltros()">
            <option [ngValue]="undefined" disabled>Selecione o Semestre</option>
            <option value="1">1º Semestre (Jan-Jun)</option>
            <option value="2">2º Semestre (Jul-Dez)</option>
          </select>
        </div>
      </label>
    </div>
    <div class="cards">
      <div class="card total">
        <div class="label">Orçamento Realizado</div>
        <img src="assets/$.png" alt="Logo" class="coin">
        <div class="value">{{ totalGasto | currency:'BRL' }}</div>
      </div>
      <div class="card orcamento">
        <div class="label">Orçamento Previsto</div>
        <img src="assets/$.png" alt="Logo" class="coin">
        <div class="value">{{ totalOrcamento | currency:'BRL' }}</div>
      </div>
      <div class="card deficit">
        <div class="label">Déficit (Prejuízo)</div>
        <img src="assets/$.png" alt="Logo" class="coin">
        <div class="value">{{ totalDeficit | currency:'BRL' }}</div>
      </div>
      <div class="card folha">
        <div class="label">Descontado na Folha</div>
        <img src="assets/$.png" alt="Logo" class="coin">
        <div class="value">{{ totalDescontado | currency:'BRL' }}</div>
      </div>
      <div class="card excedente">
        <div class="label">Excedente Aprovado</div>
        <img src="assets/$.png" alt="Logo" class="coin">
        <div class="value">{{ totalExcedenteAprovado | currency:'BRL' }}</div>
      </div>
    </div>
  </section>
</main>

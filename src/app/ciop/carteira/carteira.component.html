<app-header></app-header>
<app-sidebar-ciop></app-sidebar-ciop>
<div class="container">
  <div class="content">
    <h1>Gerenciamento de Carteira</h1>
    
    <div class="form-carteira">
      <div class="form-group">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" [(ngModel)]="novoUsuario.name" name="nome" required>
      </div>
      
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" [(ngModel)]="novoUsuario.email" name="email" required>
      </div>
      
      <div class="form-group">
        <label for="carteira">Saldo (R$):</label>
        <input type="number" id="carteira" [(ngModel)]="novoUsuario.carteira" name="carteira" min="0" step="0.01" required>
      </div>
      
      <div class="form-actions">
        <button type="submit" (click)="salvarCarteira()">
          {{ editando ? 'Atualizar' : 'Cadastrar' }}
        </button>
        <button type="button" class="btn-cancel" *ngIf="editando" (click)="cancelarEdicao()">
          Cancelar
        </button>
      </div>
    </div>
    
    <div class="tabela-usuarios">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Email</th>
            <th>Carteira (R$)</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users">
            <td>{{ user.id }}</td>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.carteira | number:'1.2-2' }}</td>
            <td class="actions">
              <button (click)="editarCarteira(user)">Editar</button>
            </td>
          </tr>
          <tr *ngIf="users.length === 0">
            <td colspan="5" class="no-data">Nenhum usuário cadastrado</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

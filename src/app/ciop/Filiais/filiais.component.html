<app-sidebar-ciop></app-sidebar-ciop>
<div class="container">
  <section class="content animate-fade-in">
    <app-header></app-header>
    <h1>Gerenciar Filiais</h1>
    <form (ngSubmit)="salvarFilial()">
      <div class="form-filial">
        <div class="form-group">
          <label for="usuario">Nome da Filial:</label>
          <input type="text" placeholder="Nome da Filial" [(ngModel)]="novaFilial.nome" name="nome" required />
        </div>
        <div class="form-group">
          <label for="usuario">Cidade da Filial</label>
          <input type="text" placeholder="Cidade" [(ngModel)]="novaFilial.cidade" name="cidade" required />
        </div>
        <div class="form-group">
          <label for="usuario">Selecione o Gerente:</label>
          <select [(ngModel)]="novaFilial.gerenteID" name="gerenteID" required>
            <option value="" disabled selected>Selecione o Gerente</option>
            <option *ngFor="let g of gerentes" [value]="g.id">
              {{ g.name }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <div class="form-actions">
            <button type="submit">{{ editando ? 'Atualizar' : 'Cadastrar' }}</button>
            <button  type="button" (click)="editando=null;  novaFilial={nome:'',cidade:'', gerenteID:''}" class="btn-cancel">
              Cancelar
            </button>
          </div>
        </div>
      </div>
    </form>
    <div class="filiais">
      <div class="tabela-filiais">
        <div class="list-filiais">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Cidade</th>
                <th>Gerente</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let filial of filiais">
                <td>{{ filial.id }}</td>
                <td>{{ filial.nome }}</td>
                <td>{{ filial.cidade }}</td>
                <td>{{ filial.gerente?.name ?? '-'}}</td>
                <td>
                  <button (click)="editarFilial(filial)">Editar</button>
                  <button (click)="excluirFilial(filial.id!)">Excluir</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="overlay" *ngIf="uploading">
    <div class="loading-box">
      <p>⏳ Carregando...</p>
    </div>
  </div>

  <div *ngIf="mensagem" class="overlay">
    <div class="mensagem-box" [ngClass]="{ 'erro': mensagemTipo === 'erro', 'sucesso': mensagemTipo === 'sucesso' }">
      <p>{{ mensagem }}</p>
      <button (click)="mensagem = ''">Fechar</button>
    </div>
  </div>
  </section>
</div>

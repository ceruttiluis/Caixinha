
 <app-sidebar-ciop></app-sidebar-ciop>
<div class="container">
  <h1>Gerenciar Filiais</h1>

  <form (ngSubmit)="salvarFilial()" class="form-filial">
    <input type="text" placeholder="Nome da Filial" [(ngModel)]="novaFilial.nome" name="nome" required />
    <input type="text" placeholder="Cidade" [(ngModel)]="novaFilial.cidade" name="cidade" required />
    <button type="submit">{{ editando ? 'Atualizar' : 'Cadastrar' }}</button>
    <button *ngIf="editando" type="button" (click)="editando=null; novaFilial={nome:'',cidade:''}">Cancelar</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Cidade</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let filial of filiais">
        <td>{{ filial.id }}</td>
        <td>{{ filial.nome }}</td>
        <td>{{ filial.cidade }}</td>
        <td>
          <button (click)="editarFilial(filial)">Editar</button>
          <button (click)="excluirFilial(filial.id!)">Excluir</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

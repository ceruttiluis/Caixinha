<app-header></app-header>
<app-sidebar-ciop></app-sidebar-ciop>
<div class="container">
<h1>Gerenciar Usuários</h1>

<form (submit)="criarUsuario(); $event.preventDefault()">
  <input [(ngModel)]="novoUsuario.nome" name="nome" placeholder="Nome" required />
  <input [(ngModel)]="novoUsuario.email" name="email" placeholder="Email" required />
  <select [(ngModel)]="novoUsuario.role" name="role">
    <option value="colaborador">Colaborador</option>
    <option value="gerente">Gerente</option>
  </select>
  <input [(ngModel)]="novoUsuario.filial_id" name="filial_id" placeholder="ID da Filial" required />
  <button type="submit">Criar Usuário</button>
</form>

<table>
  <thead>
    <tr><th>Nome</th><th>Email</th><th>Perfil</th><th>Filial</th><th>Ações</th></tr>
  </thead>
  <tbody>
    <tr *ngFor="let user of usuarios">
      <td>{{ user.nome }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.role }}</td>
      <td>{{ user.filial_id }}</td>
      <td><button (click)="excluirUsuario(user.id)">Excluir</button></td>
    </tr>
  </tbody>
</table>
</div>

<div class="Sidebar" [class.open]="sidebarOpen">
    <button class="menu-btn" (click)="toggleSidebar()">☰</button>
  <aside class="sidebar">
    <nav>
      <a routerLink="/ciop" routerLinkActive="active">
        <img class="img" src="assets/BtnDash.png" alt="Dashboard">
      </a>
      <div class="label">Dashboard</div>
      <a routerLink="/ciop/filiais" routerLinkActive="active">
        <img class="img" src="assets/Filiais.png" alt="Filiais">
      </a>
      <div class="label">Cadastro de Filiais</div>
      <a routerLink="/ciop/usuarios" routerLinkActive="active">
        <img class="img" src="assets/Usuarios.png" alt="Usuários">
      </a>
      <div class="label">Usuarios</div>
      <a routerLink="/ciop/cupons-ciop" routerLinkActive="active">
        <img class="img" src="assets/Aprovar.png" alt="Cupons-ciop">
      </a>
      <div class="label">Cupons</div>
      <a routerLink="/ciop/dash-carteira" routerLinkActive="active">
        <img class="img" src="assets/Carteira.png" alt="Carteira-ciop">
      </a>
      <div class="label">Carteira</div>
      <a routerLink="/ciop/solicitacoes" routerLinkActive="active">
        <img class="img" src="assets/Solicitacoes.png" alt="Solicitacoes">
      </a>
      <div class="label">Aprovações de Recargas</div>
      <a routerLink="/ciop/powerbi" routerLinkActive="active">
        <img class="img" src="assets/Solicitacoes.png" alt="Solicitacoes">
      </a>
      <div class="label">Power BI</div>
      <a (click)="logout()">
        <img class="img" src="assets/Logout.png" alt="Sair">
      </a>
      <div class="label">Sair</div>
    </nav>
  </aside>
      <div class="overlay" *ngIf="sidebarOpen" (click)="toggleSidebar()"></div>
</div>

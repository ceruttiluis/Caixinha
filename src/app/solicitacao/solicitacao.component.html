<div class="container">
  <div class="header">
    <div class="btn-flutuante" (click)="selectOption('home')">
      <a routerLink="/home" routerLinkActive="active">
        <img class="icon-add" src="assets/Back.png" alt="home">
      </a>
    </div>
    <img src="assets/FirstLogo.png" alt="Logo" class="Logo">
  </div>
  <div class="main-content">
  <div class="form-container">
    <h2>Solicitar Recarga</h2>
    <form [formGroup]="solicitacaoForm" (ngSubmit)="enviarCupom()">
      <label>Tipo de Recarga</label>
      <select formControlName="tipo">
        <option value="">Selecione</option>
        <option>Recarga Mensal</option>
        <option>Recarga Extra</option>
      </select>

      <label>Observações</label>
      <input type="text" formControlName="observacoes" />

      <label>Data da Solicitação</label>
      <input type="date" formControlName="data" />

      <label>Valor</label>
      <input type="number" step="0.01" formControlName="valor" />

      <button type="submit" [disabled]="uploading">Enviar</button>
    </form>
  </div>
  </div>
   <div class="overlay" *ngIf="uploading">
    <div class="loading-box">
      <p>⏳ Enviando cupom...</p>
    </div>
  </div>

  <div *ngIf="mensagem" class="overlay">
    <div class="mensagem-box" [ngClass]="{ 'erro': mensagemTipo === 'erro', 'sucesso': mensagemTipo === 'sucesso' }">
      <p>{{ mensagem }}</p>
      <button (click)="mensagem = ''">Fechar</button>
    </div>
  </div>
</div>
